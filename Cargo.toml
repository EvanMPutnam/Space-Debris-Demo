[package]
name = "space-debris-demo"
version = "0.2.0"
edition = "2024"

[dependencies]
sgp4-rust = { git = "https://github.com/EvanMPutnam/SGP4-Rust", branch = "main" }
bevy = { version = "0.17.2", features = ["jpeg"] }
chrono = { version = "0.4", features = ["clock"] }

# Propagating 28,000 objects per frame wants optimized code even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
